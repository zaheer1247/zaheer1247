<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" role="img" aria-labelledby="t d">
  <title id="t">kubeadm lab topology</title>
  <desc id="d">One control plane and three RHEL worker VMs, with k3d alongside for faster iteration.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1318"/>
      <stop offset="100%" stop-color="#0c1118"/>
    </linearGradient>
  </defs>
  <rect width="920" height="280" rx="14" fill="url(#panel)" stroke="#94a3b8" stroke-opacity="0.18"/>
  <text x="28" y="36" fill="#6b778c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.2">01 · KUBEADM TOPOLOGY</text>
  <text x="28" y="62" fill="#e8edf4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">A cluster I can break and rebuild.</text>

  <rect x="28" y="88" width="864" height="64" rx="10" fill="#5eead4" fill-opacity="0.10" stroke="#5eead4" stroke-opacity="0.45"/>
  <circle cx="52" cy="120" r="5" fill="#5eead4"/>
  <text x="70" y="116" fill="#e8edf4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Control plane</text>
  <text x="70" y="136" fill="#6b778c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">kubeadm · 1 node · k3d alongside for faster iteration</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="28" y="168" width="272" height="80" rx="10" fill="#06080c" stroke="#94a3b8" stroke-opacity="0.22"/>
    <text x="48" y="202" fill="#e8edf4" font-size="16" font-weight="600">Worker 01</text>
    <text x="48" y="224" fill="#6b778c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">RHEL VM · Parallels</text>

    <rect x="324" y="168" width="272" height="80" rx="10" fill="#06080c" stroke="#94a3b8" stroke-opacity="0.22"/>
    <text x="344" y="202" fill="#e8edf4" font-size="16" font-weight="600">Worker 02</text>
    <text x="344" y="224" fill="#6b778c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">RHEL VM · Parallels</text>

    <rect x="620" y="168" width="272" height="80" rx="10" fill="#06080c" stroke="#94a3b8" stroke-opacity="0.22"/>
    <text x="640" y="202" fill="#e8edf4" font-size="16" font-weight="600">Worker 03</text>
    <text x="640" y="224" fill="#6b778c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">RHEL VM · Parallels</text>
  </g>
</svg>
